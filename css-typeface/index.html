<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Typeface Demo</title>
    <link rel="stylesheet" href="assets/styles.css" />

   <body>
       <main>
      <!-- A -->
      <section class="letter" id="letter-a">
        <div class="roof">
          <div class="triangle"></div>

          </div>
          <div class="cell" style="grid-column: 4; grid-row: 1">
            <div class="inner"></div>
          </div>
          <div class="cell reverse" style="grid-column: 2; grid-row: 2">
            <div class="inner fill"></div>
          </div>
          <div class="cell reverse" style="grid-column: 3; grid-row: 2">
            <div class="inner fill"></div>
          </div>
          <div class="cell" style="grid-column: 1; grid-row: 2">
            <div class="inner"></div>
          </div>
          <div class="cell" style="grid-column: 4; grid-row: 2">
            <div class="inner"></div>
          </div>
          <div class="cell" style="grid-column: 1; grid-row: 3">

          </div>
          <div class="cell" style="grid-column: 1; grid-row: 4">

          </div>

          </div>

            <div class="inner fill"></div>
          </div>
          <div class="cell reverse" style="grid-column: 2; grid-row: 6">
            <div class="inner fill"></div>
          </div>
          <div class="cell reverse" style="grid-column: 3; grid-row: 6">

<script>

</script>
